version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/**/*'
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    ignore:
      - dependency-name: "node"
        versions: ["17.x","18.x","20.x"]
      # Patch updates generate a lot of noise (security patches will still be included)
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
      # We handle Node major upgrades separately - @types/node should stay aligned with current major version
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      # The update includes breaking changes that need to be checked - https://govukverify.atlassian.net/browse/PYIC-9382
      - dependency-name: "@aws-lambda-powertools/parameters"
        update-types: [ "version-update:semver-major" ]
      # Keep TypeScript on v5 for now - typescript-eslint peer range is `>=4.8.4 <6.1.0`, so TS 6/7
      # break npm peer resolution (ERESOLVE). https://govukverify.atlassian.net/browse/PYIC-9383
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: BAU
  - package-ecosystem: docker
    directories:
      - '/**/*'
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
  - package-ecosystem: "gradle"
    open-pull-requests-limit: 10
    directories:
      - '/**/*'
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
    groups:
      pre-commit:
        patterns:
          - "*"
